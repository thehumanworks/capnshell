id: no-nixpkgs-bun
valid:
  - '{ bun }: bun'
  - 'pkgs.callPackage ./nix/bun.nix { }'
invalid:
  - 'pkgs.mkShell { packages = [ pkgs.bun pkgs.git ]; }'
---
id: package-gets-pinned-bun
valid:
  - 'pkgs.callPackage ./nix/package.nix { inherit bun; }'
invalid:
  - 'pkgs.callPackage ./nix/package.nix { }'
  - 'pkgs.callPackage ./nix/package.nix { inherit lib; }'
---
id: no-ci-bun-version
valid:
  - |
    with:
      bun-version-file: package.json
invalid:
  - |
    with:
      bun-version: 1.4.4
---
id: ci-bun-from-package-json
valid:
  - |
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: package.json
  - |
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
invalid:
  - |
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
  - |
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: other.json
