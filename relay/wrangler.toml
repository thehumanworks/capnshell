# The cns relay as a Cloudflare Worker, built into cns as its default relay.
# Deploy from this directory with `wrangler deploy`. It needs no secrets: it accepts only
# requests carrying the cns client header (src/relay-hub.ts).
name = "cns-relay"
main = "worker.ts"
compatibility_date = "2026-10-01"

# The built-in relay's address is wss://cns.nothuman.work/relay (src/relay-config.ts): the
# Worker owns the custom domain cns.nothuman.work and serves the relay under /relay (and at
# the root, as on its workers.dev address).
routes = [{ pattern = "cns.nothuman.work", custom_domain = true }]

[[durable_objects.bindings]]
name = "RELAY_KEYS"
class_name = "RelayKey"

# Pairing rooms (cns pair's short codes): one object holds them all.
[[durable_objects.bindings]]
name = "RELAY_ROOMS"
class_name = "RelayRooms"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayKey"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RelayRooms"]
