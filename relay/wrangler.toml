# The cns relay as a Cloudflare Worker, built into cns as its default relay.
# Deploy from this directory with `wrangler deploy`. It needs no secrets: it accepts only
# requests carrying the cns client header (src/relay-hub.ts).
name = "cns-relay"
main = "worker.ts"
compatibility_date = "2026-10-01"

# The built-in relay's address, wss://cns.nothuman.work/relay (src/relay-config.ts). The zone
# nothuman.work must be on this Cloudflare account, with a proxied DNS record for cns.
# The Worker also answers at its workers.dev address, at the root.
routes = [{ pattern = "cns.nothuman.work/relay*", zone_name = "nothuman.work" }]

[[durable_objects.bindings]]
name = "RELAY_KEYS"
class_name = "RelayKey"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayKey"]
