# The tests on a POSIX system. The terminal tests run only there (the weekly
# Windows run skips them), and no other workflow runs the tests at all.
# It runs for pull requests that change code rather than on every push because
# this repository's Actions minutes are limited; run it on demand from the
# Actions tab or `gh workflow run test.yml`.
name: Tests

on:
  pull_request:
    paths:
      - src/**
      - pi/**
      - gateway/**
      - lint/**
      - package.json
      - bun.lock
      - tsconfig.json
      - .github/workflows/test.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
      - run: bun run test
