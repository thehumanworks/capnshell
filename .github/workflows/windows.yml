# Windows peers, and the PTY path there in particular, are otherwise untested.
# It runs once a week rather than on every push because this repository's
# Actions minutes are limited; run it on demand from the Actions tab or
# `gh workflow run windows.yml`.
name: Windows

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
      - run: bun run test
      - run: bun run test:compiled
